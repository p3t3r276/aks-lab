apiVersion: apps/v1
kind: Deployment
metadata: { name: lab-api, namespace: lab }
spec:
  replicas: 1
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: lab-api } }
  template:
    metadata: { labels: { app: lab-api } }
    spec:
      containers:
        - name: api
          image: __API_IMAGE__
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: api-secrets } }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: lab-api, namespace: lab }
spec:
  type: LoadBalancer
  selector: { app: lab-api }
  ports: [{ port: 80, targetPort: 8080 }]
