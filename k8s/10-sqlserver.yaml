apiVersion: v1
kind: Service
metadata: { name: sqlserver, namespace: lab }
spec:
  selector: { app: sqlserver }
  ports: [{ port: 1433, targetPort: 1433 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: sqlserver, namespace: lab }
spec:
  serviceName: sqlserver
  replicas: 1
  selector: { matchLabels: { app: sqlserver } }
  template:
    metadata: { labels: { app: sqlserver } }
    spec:
      securityContext:
        fsGroup: 10001          # mssql chạy với uid 10001, thiếu dòng này sẽ lỗi quyền ghi disk
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [{ containerPort: 1433 }]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: "Developer" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secrets, key: SA_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 2Gi }
            limits: { memory: 2560Mi }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources: { requests: { storage: 8Gi } }
